<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5fbff"><title>TaskScore — Productivity & To-Do</title>
<style>
:root{--bg:#f5fbff;--card:#fff;--ink:#15344c;--muted:#7b8c99;--blue:#56ace4;--green:#54c7b0;--line:#e7f0f5;--shadow:0 6px 20px rgba(36,94,130,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 18px 92px}h1{font-size:30px;margin:4px 0 20px}h2{font-size:17px;margin:22px 0 10px}.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:10px 0}
.score{text-align:center;padding:26px}.score strong{font-size:54px;color:var(--blue)}.score span{font-size:18px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric strong{font-size:20px}.metric small{display:block;color:var(--muted);margin-top:3px}
button,.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:700;cursor:pointer}.primary{width:100%;background:var(--blue);color:white}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.task{display:flex;align-items:center;gap:11px}.task .body{flex:1}.task.done .body{text-decoration:line-through;opacity:.55}.check{width:24px;height:24px;border-radius:50%;border:2px solid #86cce8;background:white}.done .check{background:var(--green);border-color:var(--green)}.x{background:none;color:#9aa8b2;padding:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav .inner{width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr)}nav button{background:none;color:#91a0aa;font-size:11px;padding:8px}nav button.active{color:#299edc}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tabs button{background:white;border:1px solid var(--line);padding:9px}.tabs .active{background:var(--blue);color:white}
.chart{height:170px;display:flex;align-items:end;gap:8px;padding-top:12px}.barwrap{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:var(--blue);border-radius:6px 6px 2px 2px;min-height:3px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
form label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}input,select{width:100%;border:1px solid #dbe9f1;border-radius:11px;padding:12px;background:#fff;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{font-size:11px;color:var(--muted)}.progress{height:8px;background:#e8f1f5;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}.history-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.hide{display:none}
</style>
</head>
<body><main class="app" id="app"></main>
<nav><div class="inner">
<button data-page="today">☀️<br>Today</button><button data-page="stats">📊<br>Stats</button><button data-page="tasks">✓<br>Tasks</button><button data-page="settings">⚙️<br>Settings</button>
</div></nav>
<script>
const KEY="taskscore_v4";
const oldKeys=["momentum_v3","momentum_v2","momentum","simpleproductivity"];
let state={tasks:[],routines:[],target:8,page:"today",statRange:"week"};
try{let raw=localStorage.getItem(KEY); if(raw) state={...state,...JSON.parse(raw)}; else for(const k of oldKeys){let v=localStorage.getItem(k);if(v){let o=JSON.parse(v);state={...state,...o};break}}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const iso=(d=new Date())=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
const today=()=>iso();
const pts=p=>({Low:1,Medium:2,High:3,Urgent:4}[p]||2);
function materialize(){
 const t=today();
 state.routines.filter(r=>!r.paused).forEach(r=>{
   let d=new Date(t+"T12:00:00"), ok=r.repeat==="daily"||(r.repeat==="weekdays"&&d.getDay()>0&&d.getDay()<6)||
     (r.repeat==="weekly"&&d.getDay()===new Date(r.start+"T12:00:00").getDay())||
     (r.repeat==="monthly"&&d.getDate()===new Date(r.start+"T12:00:00").getDate());
   if(ok&&!state.tasks.some(x=>x.routineId===r.id&&x.date===t)) state.tasks.push({...r,id:crypto.randomUUID(),routineId:r.id,date:t,done:false});
 });
 save();
}
function dayData(date){
 const a=state.tasks.filter(x=>x.date===date), total=a.reduce((s,x)=>s+pts(x.priority),0), done=a.filter(x=>x.done).reduce((s,x)=>s+pts(x.priority),0);
 return {tasks:a,total,done,score:Math.min(100,Math.round(done/state.target*100)),completed:a.filter(x=>x.done).length,rate:a.length?Math.round(a.filter(x=>x.done).length/a.length*100):0};
}
function streak(){
 let s=0,d=new Date(); for(let i=0;i<365;i++){let x=dayData(iso(d)); if(x.completed>0)s++; else if(i>0)break; d.setDate(d.getDate()-1)} return s;
}
function shell(body,page=state.page){
 document.getElementById("app").innerHTML=body;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
}
function renderToday(){
 materialize(); let d=dayData(today()), planned=d.tasks.reduce((s,x)=>s+(parseInt(x.minutes)||0),0);
 shell(`<div class="muted">Good ${new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening"}</div><h1>TaskScore</h1>
 <div class="card score"><strong>${d.score}</strong><span>/100</span><div class="muted">PRODUCTIVITY SCORE</div><div class="progress" style="margin-top:16px"><i style="width:${d.score}%"></i></div><div class="muted" style="margin-top:8px">Daily target: ${d.done} of ${state.target} points</div></div>
 <div class="grid3"><div class="card metric"><strong>${d.completed}/${d.tasks.length}</strong><small>Tasks</small></div><div class="card metric"><strong>${planned}m</strong><small>Planned</small></div><div class="card metric"><strong>${streak()}🔥</strong><small>Streak</small></div></div>
 <h2>Today's tasks</h2><div id="list">${d.tasks.length?d.tasks.map(taskHTML).join(""):`<div class="card empty">No tasks yet. Add one below.</div>`}</div>
 <button class="primary" onclick="renderAdd()">+ ADD TASK</button>`);
 bindTasks();
}
function taskHTML(t){return `<div class="card task ${t.done?"done":""}" data-id="${t.id}"><button class="check" onclick="toggleTask('${t.id}')"></button><div class="body"><b>${esc(t.name)}</b><div class="pill">${esc(t.category)} · ${t.priority} · ${t.minutes}m${t.repeat&&t.repeat!=="never"?" · "+t.repeat:""}</div></div><button class="x" onclick="delTask('${t.id}')">×</button></div>`}
function bindTasks(){}
window.toggleTask=id=>{let t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()};
window.delTask=id=>{state.tasks=state.tasks.filter(x=>x.id!==id);save();render()};
function renderTasks(){
 let upcoming=state.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date));
 shell(`<h1>Tasks</h1><div class="muted">Everything you've added</div>${upcoming.length?upcoming.map(t=>`<div class="card task ${t.done?"done":""}"><button class="check" onclick="toggleTask('${t.id}')"></button><div class="body"><b>${esc(t.name)}</b><div class="pill">${t.date} · ${esc(t.category)} · ${t.priority} · ${t.minutes}m</div></div><button class="x" onclick="delTask('${t.id}')">×</button></div>`).join(""):`<div class="card empty">No tasks yet.</div>`}<button class="primary" onclick="renderAdd()">+ ADD TASK</button>`);
}
function rangeDays(kind){
 let n=kind==="week"?7:kind==="month"?28:kind==="year"?365:730, arr=[],d=new Date();
 for(let i=n-1;i>=0;i--){let x=new Date(d);x.setDate(x.getDate()-i);arr.push(iso(x))} return arr;
}
function grouped(kind){
 let days=rangeDays(kind), groups=[];
 if(kind==="week") return days.map(x=>({label:new Date(x+"T12:00").toLocaleDateString(undefined,{weekday:"short"}),dates:[x]}));
 if(kind==="month"){for(let i=0;i<4;i++)groups.push({label:"W"+(i+1),dates:days.slice(i*7,(i+1)*7)});return groups}
 if(kind==="year"){let now=new Date();for(let i=11;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),m=d.getMonth(),y=d.getFullYear(),ds=[];while(d.getMonth()===m){ds.push(iso(d));d.setDate(d.getDate()+1)}groups.push({label:new Date(y,m,1).toLocaleDateString(undefined,{month:"short"}),dates:ds})}return groups}
 for(let i=0;i<8;i++){let y=new Date().getFullYear()-7+i;groups.push({label:String(y),dates:days.filter(x=>x.startsWith(y+"-"))})}return groups;
}
function renderStats(){
 let kind=state.statRange, days=rangeDays(kind), ds=days.map(dayData), completed=ds.reduce((s,x)=>s+x.completed,0), total=ds.reduce((s,x)=>s+x.tasks.length,0);
 let active=ds.filter(x=>x.tasks.length), avg=active.length?Math.round(active.reduce((s,x)=>s+x.score,0)/active.length):0, rate=total?Math.round(completed/total*100):0;
 let gs=grouped(kind).map(g=>{let a=g.dates.map(dayData),active=a.filter(x=>x.tasks.length),v=active.length?Math.round(active.reduce((s,x)=>s+x.score,0)/active.length):0;return {...g,v}});
 shell(`<h1>Stats</h1><div class="muted">Your progress at a glance</div>
 <div class="tabs" style="margin:16px 0">${["week","month","year","all"].map(x=>`<button class="${kind===x?"active":""}" onclick="setRange('${x}')">${x==="all"?"All time":x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
 <div class="summary"><div class="card metric"><strong>${avg}</strong><small>Avg score</small></div><div class="card metric"><strong>${completed}</strong><small>Completed</small></div><div class="card metric"><strong>${rate}%</strong><small>Completion</small></div></div>
 <div class="card"><b>${kind==="week"?"Last 7 days":kind==="month"?"Last 4 weeks":kind==="year"?"Last 12 months":"Long-term trend"}</b><div class="chart">${gs.map(g=>`<div class="barwrap"><div class="bar" style="height:${Math.max(3,g.v*1.25)}px"></div><div>${g.label}</div></div>`).join("")}</div></div>
 <div class="card"><b>Highlights</b><div class="history-row"><span>Best score</span><b>${Math.max(0,...ds.map(x=>x.score))}/100</b></div><div class="history-row"><span>Current streak</span><b>${streak()} days</b></div><div class="history-row"><span>Productive time</span><b>${Math.round(ds.flatMap(x=>x.tasks).filter(x=>x.done).reduce((s,x)=>s+(+x.minutes||0),0)/60*10)/10}h</b></div></div>`);
}
window.setRange=k=>{state.statRange=k;save();renderStats()};
function renderSettings(){
 shell(`<h1>Settings</h1><div class="card"><b>Daily target</b><div class="muted" style="margin:5px 0 12px">How many productivity points should count as a strong day?</div><select id="target" onchange="state.target=+this.value;save()">${[6,8,10,12].map(n=>`<option ${state.target==n?"selected":""} value="${n}">${n} points</option>`).join("")}</select></div>
 <div class="card"><b>Recurring tasks</b><div class="muted" style="margin:5px 0 12px">Pause, resume or remove routines without deleting your past history.</div>${state.routines.length?state.routines.map(r=>`<div class="history-row"><span><b>${esc(r.name)}</b><br><small>${r.repeat}</small></span><span><button class="ghost" onclick="pauseRoutine('${r.id}')">${r.paused?"Resume":"Pause"}</button> <button class="ghost" onclick="deleteRoutine('${r.id}')">Delete</button></span></div>`).join(""):`<div class="empty">No recurring tasks yet.</div>`}</div>`);
}
window.pauseRoutine=id=>{let r=state.routines.find(x=>x.id===id);if(r)r.paused=!r.paused;save();renderSettings()}
window.deleteRoutine=id=>{state.routines=state.routines.filter(x=>x.id!==id);save();renderSettings()}
function renderAdd(){
 shell(`<button class="ghost" onclick="render()">‹ Back</button><h1>Add task</h1><form id="f">
 <label>Task</label><input name="name" required placeholder="e.g. Guitar practice">
 <div class="row"><div><label>Category</label><select name="category"><option>Work</option><option>Personal</option><option>Learning</option><option>Health</option></select></div><div><label>Priority</label><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div></div>
 <label>Date</label><input name="date" type="date" value="${today()}" required>
 <label>Repeat</label><select name="repeat"><option value="never">Never</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>
 <label>Estimated time</label><select name="minutes"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">1 hour</option><option value="90">1.5 hours</option></select>
 <button class="primary" style="margin-top:18px">SAVE TASK</button></form>`);
 document.getElementById("f").onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),base={...f,id:crypto.randomUUID(),done:false};state.tasks.push(base);if(f.repeat!=="never")state.routines.push({...base,id:crypto.randomUUID(),start:f.date,paused:false});save();state.page="today";renderToday()}
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){({today:renderToday,stats:renderStats,tasks:renderTasks,settings:renderSettings}[state.page]||renderToday)()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();render()});
render();
</script></body></html>
